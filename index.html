<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modern BMI Calculator</title>
  <style>
    :root {
      --bg1: #0f172a;
      --bg2: #111827;
      --card: rgba(15, 23, 42, 0.72);
      --card-strong: rgba(17, 24, 39, 0.9);
      --primary: #8b5cf6;
      --secondary: #06b6d4;
      --accent: #34d399;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --danger: #f87171;
      --warning: #fbbf24;
      --success: #4ade80;
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(139, 92, 246, 0.22), transparent 30%),
        radial-gradient(circle at bottom right, rgba(6, 182, 212, 0.18), transparent 35%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
      color: var(--text);
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .app {
      width: min(1100px, 100%);
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 26px;
      align-items: stretch;
    }

    .panel {
      background: rgba(15, 23, 42, 0.72);
      border: 1px solid rgba(148, 163, 184, 0.12);
      backdrop-filter: blur(18px);
      border-radius: 28px;
      box-shadow: var(--shadow);
    }

    .calculator {
      padding: 32px;
    }

    .header {
      margin-bottom: 28px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(139, 92, 246, 0.12);
      color: #d8b4fe;
      padding: 8px 12px;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .badge::before {
      content: "●";
      color: var(--secondary);
      font-size: 11px;
    }

    h1 {
      margin: 18px 0 8px;
      font-size: clamp(2rem, 3vw, 3.1rem);
      line-height: 1.1;
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 0.98rem;
      line-height: 1.7;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      font-size: 0.9rem;
      color: #dfe7f3;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    input[type="date"],
    input[type="number"] {
      width: 100%;
      background: rgba(15, 23, 42, 0.8);
      color: var(--text);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 16px;
      padding: 16px 18px;
      font-size: 1rem;
      outline: none;
      transition: 0.25s ease;
    }

    input[type="date"]:focus,
    input[type="number"]:focus {
      border-color: rgba(34, 211, 238, 0.9);
      box-shadow: 0 0 0 4px rgba(34, 211, 238, 0.1);
    }

    .gender-wrap {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    .gender-option {
      position: relative;
      flex: 1 1 130px;
      min-width: 110px;
    }

    .gender-option input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .gender-option span {
      display: block;
      width: 100%;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 16px;
      padding: 15px 16px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s ease;
      font-weight: 600;
      color: var(--text);
    }

    .gender-option input:checked + span {
      border-color: rgba(34, 211, 238, 0.9);
      background: linear-gradient(135deg, rgba(6, 182, 212, 0.18), rgba(139, 92, 246, 0.18));
      box-shadow: inset 0 0 0 1px rgba(34, 211, 238, 0.35);
    }

    .unit {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-weight: 700;
      pointer-events: none;
    }

    .input-wrap {
      position: relative;
    }

    .action-row {
      display: flex;
      gap: 16px;
      align-items: center;
      margin-top: 26px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      outline: none;
      cursor: pointer;
      border-radius: 16px;
      padding: 16px 24px;
      background: linear-gradient(135deg, var(--secondary), var(--primary));
      color: white;
      font-weight: 800;
      font-size: 1rem;
      letter-spacing: 0.02em;
      box-shadow: 0 10px 30px rgba(6, 182, 212, 0.25);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 30px rgba(6, 182, 212, 0.3);
    }

    button.secondary {
      background: transparent;
      border: 1px solid rgba(148, 163, 184, 0.25);
      color: var(--text);
      box-shadow: none;
    }

    .error {
      min-height: 24px;
      color: #fca5a5;
      font-size: 0.9rem;
      margin-top: 6px;
      display: none;
    }

    .error.show {
      display: block;
    }

    .result-panel {
      background: linear-gradient(180deg, rgba(17, 24, 39, 0.96), rgba(15, 23, 42, 0.8));
      padding: 26px 26px 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .result-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    .result-header h2 {
      margin: 0;
      font-size: 1.2rem;
      letter-spacing: -0.02em;
    }

    .chip {
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.02);
      color: var(--muted);
    }

    .bmi-total {
      font-size: clamp(3rem, 6vw, 5.3rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.07em;
      margin: 14px 0 18px;
      display: flex;
      align-items: baseline;
      gap: 8px;
      color: #ffffff;
    }

    .bmi-total small {
      font-size: 1rem;
      letter-spacing: 0;
      opacity: 0.8;
    }

    .status-box {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(148, 163, 184, 0.12);
      border-radius: 18px;
      padding: 18px 16px;
      margin-bottom: 20px;
    }

    .status-title {
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 8px;
    }

    .status-text {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text);
    }

    .stats {
      display: grid;
      gap: 12px;
      margin-top: 12px;
    }

    .stat {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(148, 163, 184, 0.1);
      border-radius: 14px;
      padding: 14px 16px;
    }

    .stat-label {
      color: var(--muted);
      font-size: 0.82rem;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .stat-value {
      font-size: 1.1rem;
      font-weight: 800;
    }

    .info-note {
      margin-top: 20px;
      line-height: 1.6;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 820px) {
      .app {
        grid-template-columns: 1fr;
      }

      .calculator {
        padding: 24px 20px;
      }

      .result-panel {
        padding: 22px 20px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <section class="panel calculator">
      <div class="header">
        <div class="badge">Health Dashboard</div>
        <h1>BMI Calculator</h1>
        <p class="subtitle">
          Enter your details to calculate body mass index and understand your current health range.
        </p>
      </div>

      <form id="bmiForm" novalidate>
        <div class="form-grid">
          <div class="field full">
            <label for="dob">Date of birth</label>
            <input id="dob" name="dob" type="date" required />
          </div>

          <div class="field full">
            <label>Gender</label>
            <div class="gender-wrap">
              <label class="gender-option">
                <input type="radio" name="gender" value="Male" checked />
                <span>Male</span>
              </label>
              <label class="gender-option">
                <input type="radio" name="gender" value="Female" />
                <span>Female</span>
              </label>
              <label class="gender-option">
                <input type="radio" name="gender" value="Other" />
                <span>Other</span>
              </label>
            </div>
          </div>

          <div class="field">
            <label for="height">Height (cm)</label>
            <div class="input-wrap">
              <input id="height" name="height" type="number" min="50" max="250" step="0.1" placeholder="e.g. 175" required />
              <span class="unit">cm</span>
            </div>
          </div>

          <div class="field">
            <label for="weight">Weight (kg)</label>
            <div class="input-wrap">
              <input id="weight" name="weight" type="number" min="20" max="300" step="0.1" placeholder="e.g. 68.5" required />
              <span class="unit">kg</span>
            </div>
          </div>
        </div>

        <div class="action-row">
          <button type="submit">Calculate BMI</button>
          <button type="button" class="secondary" id="resetBtn">Reset</button>
        </div>

        <div id="error" class="error" aria-live="polite"></div>
      </form>
    </section>

    <aside class="panel result-panel">
      <div>
        <div class="result-header">
          <h2>Result</h2>
          <div id="resultChip" class="chip">Waiting</div>
        </div>

        <div class="bmi-total">
          <span id="bmiValue">0.00</span>
          <small>BMI</small>
        </div>

        <div class="status-box">
          <div class="status-title">Category</div>
          <div id="statusText" class="status-text">Enter your details</div>
        </div>
      </div>

      <div class="stats">
        <div class="stat">
          <div class="stat-label">Age</div>
          <div id="ageValue" class="stat-value">0 years</div>
        </div>

        <div class="stat">
          <div class="stat-label">Ideal Weight Range</div>
          <div id="idealWeightValue" class="stat-value">—</div>
        </div>

        <div class="stat">
          <div class="stat-label">Gender</div>
          <div id="genderValue" class="stat-value">—</div>
        </div>
      </div>

      <div class="info-note" id="infoNote">
        BMI is calculated as: weight (kg) ÷ height² (m²).
      </div>
    </aside>
  </div>

  <script>
    const form = document.getElementById("bmiForm");
    const errorBox = document.getElementById("error");
    const resetBtn = document.getElementById("resetBtn");

    const bmiValue = document.getElementById("bmiValue");
    const statusText = document.getElementById("statusText");
    const resultChip = document.getElementById("resultChip");
    const ageValue = document.getElementById("ageValue");
    const idealWeightValue = document.getElementById("idealWeightValue");
    const genderValue = document.getElementById("genderValue");
    const infoNote = document.getElementById("infoNote");

    function showError(message) {
      errorBox.textContent = message;
      errorBox.classList.add("show");
    }

    function clearError() {
      errorBox.textContent = "";
      errorBox.classList.remove("show");
    }

    function calculateAge(dateString) {
      const birthDate = new Date(dateString);
      const today = new Date();

      if (Number.isNaN(birthDate.getTime())) return null;

      let age = today.getFullYear() - birthDate.getFullYear();
      const monthDiff = today.getMonth() - birthDate.getMonth();
      const dayDiff = today.getDate() - birthDate.getDate();

      if (monthDiff < 0 || (monthDiff === 0 && dayDiff < 0)) {
        age--;
      }

      return age;
    }

    function getBMIStatus(bmi) {
      if (bmi < 18.5) return {
        label: "Underweight",
        color: "#fbbf24",
        note: "Your BMI is below the healthy range. Consider a balanced diet and consult a professional if needed."
      };
      if (bmi < 25) return {
        label: "Healthy Weight",
        color: "#4ade80",
        note: "Your BMI is in the healthy range. Keep up your current habits."
      };
      if (bmi < 30) return {
        label: "Overweight",
        color: "#fbbf24",
        note: "Your BMI indicates being overweight. A healthy routine and nutrition plan can help."
      };
      if (bmi < 35) return {
        label: "Obesity Class I",
        color: "#f97316",
        note: "Your BMI indicates obesity. Consider consulting a healthcare professional for guidance."
      };
      if (bmi < 40) return {
        label: "Obesity Class II",
        color: "#ef4444",
        note: "Your BMI is significantly above the healthy range. Professional support is recommended."
      };
      return {
        label: "Obesity Class III",
        color: "#dc2626",
        note: "Your BMI is in the severe obesity range. Please speak with a medical professional promptly."
      };
    }

    function getIdealWeightRange(heightCm) {
      const heightM = heightCm / 100;
      const minWeight = 18.5 * heightM * heightM;
      const maxWeight = 24.9 * heightM * heightM;
      return { min: minWeight, max: maxWeight };
    }

    function formatWeight(value) {
      return `${value.toFixed(1)} kg`;
    }

    function validateInput() {
      const dob = document.getElementById("dob").value;
      const height = Number(document.getElementById("height").value);
      const weight = Number(document.getElementById("weight").value);

      if (!dob) {
        showError("Please select your date of birth.");
        return false;
      }

      const age = calculateAge(dob);
      if (age === null || age < 2) {
        showError("Please enter a valid date of birth.");
        return false;
      }

      const today = new Date();
      const selectedDate = new Date(dob);
      if (selectedDate > today) {
        showError("Date of birth cannot be in the future.");
        return false;
      }

      if (!height || height < 50 || height > 250) {
        showError("Height must be between 50 and 250 cm.");
        return false;
      }

      if (!weight || weight < 20 || weight > 300) {
        showError("Weight must be between 20 and 300 kg.");
        return false;
      }

      return true;
    }

    function renderBMI(event) {
      event.preventDefault();
      clearError();

      if (!validateInput()) {
        return;
      }

      const dob = document.getElementById("dob").value;
      const gender = document.querySelector('input[name="gender"]:checked').value;
      const heightCm = Number(document.getElementById("height").value);
      const weightKg = Number(document.getElementById("weight").value);

      const heightM = heightCm / 100;
      const bmi = weightKg / (heightM * heightM);
      const status = getBMIStatus(bmi);
      const age = calculateAge(dob);
      const ideal = getIdealWeightRange(heightCm);

      bmiValue.textContent = bmi.toFixed(2);
      statusText.textContent = status.label;
      resultChip.textContent = status.label;
      resultChip.style.color = status.color;
      resultChip.style.borderColor = status.color + "55";
      resultChip.style.background = status.color + "18";

      ageValue.textContent = `${age} years`;
      genderValue.textContent = gender;
      idealWeightValue.textContent = `${formatWeight(ideal.min)} - ${formatWeight(ideal.max)}`;

      infoNote.textContent = `BMI formula: weight (kg) ÷ height² (m²). ${status.note}`;

      statusText.style.color = status.color;
      statusText.style.fontWeight = "800";
    }

    form.addEventListener("submit", renderBMI);

    resetBtn.addEventListener("click", () => {
      form.reset();
      clearError();
      bmiValue.textContent = "0.00";
      statusText.textContent = "Enter your details";
      resultChip.textContent = "Waiting";
      resultChip.style.color = "#9ca3af";
      resultChip.style.borderColor = "rgba(255,255,255,0.08)";
      resultChip.style.background = "rgba(255,255,255,0.02)";
      ageValue.textContent = "0 years";
      idealWeightValue.textContent = "—";
      genderValue.textContent = "—";
      infoNote.textContent = "BMI is calculated as: weight (kg) ÷ height² (m²).";
      statusText.style.color = "var(--text)";
    });
  </script>
</body>
</html>
